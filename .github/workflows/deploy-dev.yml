name: Deploy DEV

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push DEV Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:dev .
          docker push ghcr.io/${{ github.repository }}:dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy DEV
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            set -e
            cd ${{ secrets.DEV_SERVER_PATH }}

            cat > .env << ENVEOF
            SPRING_DATASOURCE_URL=${{ secrets.DEV_DB_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.DEV_DB_USER }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            IMAGE_NAME=ghcr.io/${{ github.repository }}:dev
            TAG=dev
            ENVEOF

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          EOF

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f ~/.ssh/known_hosts